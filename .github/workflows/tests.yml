name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - run: |
          Rscript -e 'install.packages(c("Seurat","ggplot2","jsonlite","testthat","withr","remotes","fields","KernSmooth","ROCR"))'
          Rscript -e 'remotes::install_github("chris-mcginnis-ucsf/DoubletFinder", upgrade = "never")'
      - run: Rscript tests/testthat.R
